<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter</title>
    <link rel="stylesheet" href="./Css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <div class="background"></div>
        <h1 class="header_title">Word <span class="header_title--span">Analytics</span></h1>
        <h2 class="Athure_Name">Arash_MF</h2>
    </header>
    <div class="Container">
        <textarea class="textarea" placeholder="Enter text"></textarea>
        <section class="Boxes">
            <section class="Box">
                <span Box_number Box_Number--word>0</span>
                <h2>Word</h2>
            </section>
            <section class="Box">
                <span Box_number Box_Number--characters>0</span>
                <h2>characters</h2>

            </section>
            <section class="Box">
                <span Box_number Box_Number--Twitter>280</span>
                <h2>Twitter</h2>

            </section>
              <section class="Box">
                <span Box_number Box_Number--facebook>2200</span>
                <h2>facebook</h2>

            </section>
        </section>
    </div>
    <footer class="footer">
        <small class="copyright">
            &copy; Copyright by Arash_MF All rights reserved
        </small>
        <small class="data">
            Last checked limits: 17 days ago
        </small>
    </footer>
</body>
<script src="./Js/script.js"></script>

</html>
